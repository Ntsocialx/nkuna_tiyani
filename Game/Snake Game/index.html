<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muted Cozy Snake</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f7f2f0;      /* Warm off-white */
            --canvas-bg: #ffffff;
            --snake-head: #84a59d;    /* Muted Sage */
            --snake-body: #a8dadc;    /* Dusty Blue */
            --food-color: #e5989b;    /* Muted Coral/Rose */
            --text-main: #6d6875;     /* Soft Charcoal */
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            transform: translateY(0);
            transition: transform 0.3s ease;
        }

        canvas {
            background-color: var(--canvas-bg);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(109, 104, 117, 0.1);
            display: block;
        }

        /* Smooth UI Transitions */
        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(247, 242, 240, 0.8);
            backdrop-filter: blur(6px);
            border-radius: 24px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .btn {
            background-color: var(--snake-head);
            color: white;
            padding: 12px 32px;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(132, 165, 157, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(132, 165, 157, 0.4);
            filter: brightness(1.05);
        }

        .scoreboard {
            background: rgba(255, 255, 255, 0.6);
            padding: 8px 24px;
            border-radius: 50px;
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(109, 104, 117, 0.1);
        }

        .shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
    </style>
</head>
<body>

    <div class="scoreboard text-sm font-semibold tracking-wide uppercase">
        <div>Score <span id="current-score" class="ml-1 text-rose-400">0</span></div>
        <div class="w-px h-4 bg-gray-300 self-center"></div>
        <div>Best <span id="high-score" class="ml-1">0</span></div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <!-- Start Screen -->
        <div id="start-overlay" class="overlay active">
            <h1 class="text-3xl font-bold mb-6">Cozy Snake</h1>
            <button onclick="startGame()" class="btn">Begin Journey</button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-overlay" class="overlay">
            <span class="text-4xl mb-2">🍃</span>
            <h2 class="text-2xl font-bold mb-1">Rest Time</h2>
            <p class="mb-6 opacity-70">The snake is tuckered out.</p>
            <button onclick="resetGame()" class="btn">Try Again</button>
        </div>
    </div>

    <p class="mt-8 text-xs font-medium opacity-40 uppercase tracking-widest">Arrows to move • Space to pause</p>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('current-score');
        const highscoreEl = document.getElementById('high-score');
        const startOverlay = document.getElementById('start-overlay');
        const gameOverOverlay = document.getElementById('game-over-overlay');
        const container = document.getElementById('game-container');

        // Config
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        
        let snake = [{x: 10, y: 10}, {x: 10, y: 11}, {x: 10, y: 12}];
        let food = {x: 5, y: 5};
        let dx = 0;
        let dy = -1;
        let nextDir = {x: 0, y: -1};
        
        let score = 0;
        let highScore = localStorage.getItem('mutedSnakeBest') || 0;
        highscoreEl.textContent = highScore;

        let lastTime = 0;
        let moveTimer = 0;
        let speed = 150; // ms per move
        let gameActive = false;
        let isPaused = false;

        /**
         * INPUT HANDLING
         */
        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowUp' && dy === 0) nextDir = {x: 0, y: -1};
            if (e.key === 'ArrowDown' && dy === 0) nextDir = {x: 0, y: 1};
            if (e.key === 'ArrowLeft' && dx === 0) nextDir = {x: -1, y: 0};
            if (e.key === 'ArrowRight' && dx === 0) nextDir = {x: 1, y: 0};
            if (e.key === ' ') isPaused = !isPaused;
        });

        /**
         * GAME LOGIC
         */
        function spawnFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
            // Don't spawn on snake
            if (snake.some(p => p.x === food.x && p.y === food.y)) spawnFood();
        }

        function update(timestamp) {
            if (!gameActive || isPaused) {
                requestAnimationFrame(update);
                return;
            }

            const deltaTime = timestamp - lastTime;
            lastTime = timestamp;
            moveTimer += deltaTime;

            if (moveTimer >= speed) {
                moveSnake();
                moveTimer = 0;
            }

            draw(timestamp);
            requestAnimationFrame(update);
        }

        function moveSnake() {
            dx = nextDir.x;
            dy = nextDir.y;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Wall Collision
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) return endGame();
            // Self Collision
            if (snake.some(p => p.x === head.x && p.y === head.y)) return endGame();

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.textContent = score;
                speed = Math.max(70, speed - 2);
                spawnFood();
            } else {
                snake.pop();
            }
        }

        /**
         * RENDERING
         */
        function draw(t) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Subtle Grid
            ctx.strokeStyle = "#fdfdfd";
            ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=gridSize) {
                ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke();
            }

            // Draw Food with Pulse Animation
            const pulse = Math.sin(t / 200) * 2;
            const fx = food.x * gridSize + gridSize/2;
            const fy = food.y * gridSize + gridSize/2;
            
            ctx.fillStyle = "#e5989b";
            ctx.beginPath();
            ctx.arc(fx, fy, (gridSize/2 - 4) + pulse, 0, Math.PI*2);
            ctx.fill();

            // Draw Snake
            snake.forEach((part, i) => {
                const isHead = i === 0;
                ctx.fillStyle = isHead ? "#84a59d" : "#a8dadc";
                
                const x = part.x * gridSize + 2;
                const y = part.y * gridSize + 2;
                const size = gridSize - 4;
                const r = isHead ? 8 : 4;

                ctx.beginPath();
                ctx.roundRect(x, y, size, size, r);
                ctx.fill();

                if (isHead) {
                    // Muted Eyes
                    ctx.fillStyle = "rgba(255,255,255,0.6)";
                    const eyeSize = 2.5;
                    let ex1, ey1, ex2, ey2;

                    if (dx === 1) { ex1=x+12; ey1=y+4; ex2=x+12; ey2=y+10; }
                    else if (dx === -1) { ex1=x+4; ey1=y+4; ex2=x+4; ey2=y+10; }
                    else if (dy === 1) { ex1=x+4; ey1=y+12; ex2=x+12; ey2=y+12; }
                    else { ex1=x+4; ey1=y+4; ex2=x+12; ey2=y+4; }

                    ctx.beginPath();
                    ctx.arc(ex1, ey1, eyeSize, 0, Math.PI*2);
                    ctx.arc(ex2, ey2, eyeSize, 0, Math.PI*2);
                    ctx.fill();
                }
            });
        }

        function startGame() {
            startOverlay.classList.remove('active');
            gameActive = true;
            lastTime = performance.now();
            requestAnimationFrame(update);
        }

        function endGame() {
            gameActive = false;
            container.classList.add('shake');
            setTimeout(() => container.classList.remove('shake'), 400);

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('mutedSnakeBest', highScore);
                highscoreEl.textContent = highScore;
            }
            gameOverOverlay.classList.add('active');
        }

        function resetGame() {
            score = 0;
            scoreEl.textContent = "0";
            speed = 150;
            snake = [{x: 10, y: 10}, {x: 10, y: 11}, {x: 10, y: 12}];
            dx = 0; dy = -1;
            nextDir = {x: 0, y: -1};
            gameOverOverlay.classList.remove('active');
            spawnFood();
            gameActive = true;
        }

        spawnFood();
    </script>
</body>
</html>
